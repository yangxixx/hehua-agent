[project]
name = "hehua"
version = "0.2.0"
description = "Autonomous offensive-security agent: point at a target, it pentests."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hehua"]
