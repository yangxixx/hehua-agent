[project]
name = "hehua"
version = "0.1.0"
description = "Autonomous offensive-security (pentest) agent: LLM tool-use loop + deterministic orchestration"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tsec-benchmark>=0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hehua"]

